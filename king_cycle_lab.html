<script>
"use strict";

let DATA = null;
try {
  DATA = JSON.parse(document.getElementById('king-data').textContent);
} catch (e) {
  console.error('Failed to parse king-data:', e);
  document.body.insertAdjacentHTML('afterbegin',
    '<div style="background:#440;color:#fdc;padding:10px">⚠ king cycle data missing — run python compute_king_cycle.py + inject script.</div>');
}

const NS = "http://www.w3.org/2000/svg";
const tilesGroup = document.getElementById('g-tiles');
const overlayGroup = document.getElementById('g-overlay');
const info = document.getElementById('info');

let state = {
  tick: 0,
  playing: false,
};

function setTick(j) {
  state.tick = ((j % 5) + 5) % 5;
  render();
  document.getElementById('cycle-stat').textContent = `tick ${state.tick} / 5`;
}

function render() {
  if (!DATA) return;
  tilesGroup.innerHTML = '';
  overlayGroup.innerHTML = '';
  const tick = state.tick;

  // Render tiles in 3 layers: empire (dark red), K-tiles (bright red), other (black)
  // We render in z-order: black first, then empire on top, then K on top.
  // For SVG, just use document order (later = on top).
  const layer_off = [];
  const layer_emp = [];
  const layer_ce  = [];

  for (const t of DATA.tiles) {
    if (t.is_k_tile_K[tick]) {
      layer_ce.push(t);
    } else if (t.in_empire_K[tick]) {
      layer_emp.push(t);
    } else {
      layer_off.push(t);
    }
  }

  // Render
  function add(t, fill, stroke, sw) {
    const pts = t.corners_2d.map(p => `${p[0].toFixed(4)},${p[1].toFixed(4)}`).join(' ');
    const poly = document.createElementNS(NS, 'polygon');
    poly.setAttribute('points', pts);
    poly.setAttribute('fill', fill);
    if (stroke) {
      poly.setAttribute('stroke', stroke);
      poly.setAttribute('stroke-width', sw);
      poly.setAttribute('stroke-linejoin', 'round');
    }
    tilesGroup.appendChild(poly);
  }
  // Off tiles: black fill, thin gray edge
  for (const t of layer_off) add(t, '#0a0a0a', '#222', '0.018');
  // Empire tiles: dark red fill, slightly brighter edge
  for (const t of layer_emp) add(t, '#552020', '#774040', '0.022');
  // CE tiles: bright red fill, white edge to pop
  for (const t of layer_ce)  add(t, '#cc1010', '#ff6644', '0.04');

  // Overlay: highlight the current K vertex itself + draw the star decagon
  const k = DATA.cycle[tick];
  // K-vertex marker: small bright circle
  const ckv = document.createElementNS(NS, 'circle');
  ckv.setAttribute('cx', k.k_xy_2d[0]);
  ckv.setAttribute('cy', k.k_xy_2d[1]);
  ckv.setAttribute('r', 0.15);
  ckv.setAttribute('fill', '#ffd');
  ckv.setAttribute('opacity', '0.95');
  overlayGroup.appendChild(ckv);
  const ckv_ring = document.createElementNS(NS, 'circle');
  ckv_ring.setAttribute('cx', k.k_xy_2d[0]);
  ckv_ring.setAttribute('cy', k.k_xy_2d[1]);
  ckv_ring.setAttribute('r', 0.30);
  ckv_ring.setAttribute('fill', 'none');
  ckv_ring.setAttribute('stroke', '#ffd');
  ckv_ring.setAttribute('stroke-width', '0.04');
  overlayGroup.appendChild(ckv_ring);

  // Star decagon: 10-fold symmetric centerpiece, drawn through the 5 K-vertices' positions
  // (project to 5-fold radius) — show all 5 K positions as faint markers
  for (let i = 0; i < 5; i++) {
    const ki = DATA.cycle[i];
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', ki.k_xy_2d[0]);
    c.setAttribute('cy', ki.k_xy_2d[1]);
    c.setAttribute('r', 0.10);
    c.setAttribute('fill', i === tick ? '#ff6' : '#664');
    c.setAttribute('opacity', i === tick ? '1.0' : '0.5');
    overlayGroup.appendChild(c);
  }
  // Connect the 5 K positions with a faint pentagon
  const pent = document.createElementNS(NS, 'polygon');
  const pentPts = DATA.cycle.map(c =>
    `${c.k_xy_2d[0].toFixed(3)},${c.k_xy_2d[1].toFixed(3)}`
  ).join(' ');
  pent.setAttribute('points', pentPts);
  pent.setAttribute('fill', 'none');
  pent.setAttribute('stroke', '#553');
  pent.setAttribute('stroke-width', '0.025');
  pent.setAttribute('stroke-dasharray', '0.08 0.08');
  pent.setAttribute('opacity', '0.5');
  overlayGroup.appendChild(pent);
  // Dashed circle through the K-positions
  const ringR = k.r;
  const ring = document.createElementNS(NS, 'circle');
  ring.setAttribute('cx', '0'); ring.setAttribute('cy', '0');
  ring.setAttribute('r', ringR.toFixed(3));
  ring.setAttribute('fill', 'none');
  ring.setAttribute('stroke', '#443');
  ring.setAttribute('stroke-width', '0.02');
  ring.setAttribute('stroke-dasharray', '0.10 0.10');
  ring.setAttribute('opacity', '0.5');
  overlayGroup.appendChild(ring);

  // Info panel
  const nCE = layer_ce.length;
  const nEmp = layer_emp.length;
  const nOff = layer_off.length;
  info.innerHTML =
    `<b>K_${tick}</b> at (${k.k_xy_2d[0].toFixed(2)}, ${k.k_xy_2d[1].toFixed(2)})<br>` +
    `r = ${k.r.toFixed(3)}, θ = ${k.theta_deg.toFixed(1)}°<br>` +
    `CE: ${nCE} tiles &nbsp; empire: ${nEmp} &nbsp; off: ${nOff}<br>` +
    `W_E vol: ${k.empire_window_volume.toFixed(4)}`;
}

// Controls
document.getElementById('btn-prev').onclick = () => setTick(state.tick - 1);
document.getElementById('btn-next').onclick = () => setTick(state.tick + 1);
document.getElementById('btn-play').onclick = () => {
  state.playing = !state.playing;
  document.getElementById('btn-play').textContent = state.playing ? '⏸ Pause' : '▶ Auto-cycle';
  if (state.playing) autoTick();
};
function autoTick() {
  if (!state.playing) return;
  setTick(state.tick + 1);
  setTimeout(autoTick, 1100);
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') setTick(state.tick - 1);
  else if (e.key === 'ArrowRight') setTick(state.tick + 1);
  else if (e.key === ' ') {
    e.preventDefault();
    document.getElementById('btn-play').click();
  }
});

if (DATA) {
  // Auto-fit viewBox to data bounds
  let xMin=Infinity,xMax=-Infinity,yMin=Infinity,yMax=-Infinity;
  for (const t of DATA.tiles) for (const c of t.corners_2d) {
    if (c[0]<xMin) xMin=c[0];
    if (c[0]>xMax) xMax=c[0];
    if (c[1]<yMin) yMin=c[1];
    if (c[1]>yMax) yMax=c[1];
  }
  const pad = 0.5;
  const W = xMax-xMin+2*pad, H = yMax-yMin+2*pad;
  const side = Math.max(W,H);
  const cx = (xMin+xMax)/2, cy = (yMin+yMax)/2;
  document.getElementById('canvas').setAttribute('viewBox',
    `${cx-side/2} ${cy-side/2} ${side} ${side}`);
  setTick(0);
}
</script>
</body>
</html>
